  CLIENT FOOTER ATTRIBUTION SNIPPET

  Paste this inside the footer of every site you build for a client.

  SEO notes:

     on every client site, identical keyword anchors site-wide look spammy to
     Google and can hurt instead of help. Branded/natural anchors are safest.
   - One link per site is plenty. Footer (site-wide) is fine.

  Pick ONE of the variants below. Drop the target="_blank" if you'd rather it
  open in the same tab.
  ============================================================
-->
