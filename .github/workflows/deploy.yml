name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_PATH: "."

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.BUILD_PATH }}

      - name: Build with Astro
        run: npm run build
        working-directory: ${{ env.BUILD_PATH }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Cloudflare caches assets at the edge for 4 hours. Without this, a deploy
      # that adds or removes a file can serve a stale 404 for the new one, or keep
      # serving a deleted one, until that TTL expires. Purging here makes every
      # deploy self-clearing.
      # Inert until both repo secrets exist, so it is safe to merge as-is:
      #   CLOUDFLARE_API_TOKEN  - token with Zone -> Cache Purge -> Purge, scoped to mauops.com
      #   CLOUDFLARE_ZONE_ID    - from the domain overview page in the Cloudflare dashboard
      - name: Purge Cloudflare cache
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ZONE" ]; then
            echo "Cloudflare secrets not configured. Skipping cache purge."
            exit 0
          fi
          response=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          if echo "$response" | grep -q '"success":true'; then
            echo "Cloudflare cache purged."
          else
            echo "Cache purge failed. Deploy itself succeeded."
            echo "$response" | sed 's/"result":{[^}]*}//'
            exit 1
          fi
