<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d9680"/>
      <stop offset="1" stop-color="#3dcfab"/>
    </linearGradient>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="white" stroke-width="0.3" opacity="0.15"/>
    </pattern>
    <pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="0.4" fill="white" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Gradient background -->
  <rect width="48" height="48" rx="11" fill="url(#bg)"/>
  <rect width="48" height="48" rx="11" fill="url(#grid)"/>
  <rect width="48" height="48" rx="11" fill="url(#dots)"/>

  <!-- Circuit traces bottom-right -->
  <g opacity="0.2">
    <path d="M32 42 h6 l3 -3 v-5" stroke="white" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M35 39 h4 l2 -2" stroke="white" stroke-width="0.6" stroke-linecap="round" fill="none"/>
    <circle cx="41" cy="34" r="1" fill="white"/>
    <circle cx="41" cy="37" r="0.6" fill="white"/>
  </g>

  <!-- Bold white M -->
  <path
    d="M8 38 V11 L15 11 L24 23 L33 11 L40 11 V38 H34 V21 L24 32 L14 21 V38 Z"
    fill="white"
  />
</svg>
