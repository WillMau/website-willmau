<svg width="180" height="48" viewBox="0 0 180 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon part -->
  <g transform="translate(0, 0)">
    <!-- Connection lines forming M shape -->
    <path d="M6 36 L6 24 L20 12 L34 24 L34 36" stroke="url(#logoGradientDark)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7"/>

    <!-- Network nodes -->
    <circle cx="6" cy="36" r="3" fill="url(#logoGradientDark)" opacity="0.9"/>
    <circle cx="6" cy="24" r="2.5" fill="url(#logoGradientDark)" opacity="0.85"/>
    <circle cx="20" cy="12" r="3.5" fill="url(#logoGradientDark)"/>
    <circle cx="34" cy="24" r="2.5" fill="url(#logoGradientDark)" opacity="0.85"/>
    <circle cx="34" cy="36" r="3" fill="url(#logoGradientDark)" opacity="0.9"/>
  </g>

  <!-- Text part -->
  <text x="48" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">MAU</text>
  <text x="48" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="1.5" fill="#9ca3af">CONSULTING</text>
</svg>
