<svg width="180" height="48" viewBox="0 0 180 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="40" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d9680"/>
      <stop offset="1" stop-color="#3dcfab"/>
    </linearGradient>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="white" stroke-width="0.3" opacity="0.15"/>
    </pattern>
    <pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="0.4" fill="white" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Icon -->
  <g>
    <rect width="40" height="48" rx="11" fill="url(#bg)"/>
    <rect width="40" height="48" rx="11" fill="url(#grid)"/>
    <rect width="40" height="48" rx="11" fill="url(#dots)"/>
    <!-- Circuit traces -->
    <g opacity="0.2">
      <path d="M26 42 h6 l3 -3 v-4" stroke="white" stroke-width="0.7" stroke-linecap="round" fill="none"/>
      <path d="M29 39 h3 l2 -2" stroke="white" stroke-width="0.5" stroke-linecap="round" fill="none"/>
      <circle cx="35" cy="35" r="0.8" fill="white"/>
    </g>
    <!-- Bold M -->
    <path
      d="M6 38 V11 L12 11 L20 23 L28 11 L34 11 V38 H29 V21 L20 32 L11 21 V38 Z"
      fill="white"
    />
  </g>

  <!-- Text -->
  <text x="52" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#111827">MAU</text>
  <text x="52" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="1.5" fill="#6b7280">CONSULTING</text>
</svg>
